
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08131d">
  <title>ZEV DOD APEX</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(
        145deg, #08131d, #142d3b
      );
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      padding: 35px 20px;
      border: 1px solid #2a5664;
      border-radius: 20px;
      background: #10222e;
    }

    h1 {
      color: #65f0c1;
      font-size: 42px;
      letter-spacing: 4px;
      margin: 10px 0;
    }

    .brand {
      font-size: 14px;
      letter-spacing: 3px;
    }

    .subtitle {
      color: #a9c5d0;
      font-size: 14px;
      line-height: 1.6;
    }

    .status {
      margin-top: 25px;
      padding: 15px;
      border-radius: 12px;
      background: #173c37;
      color: #7df5c9;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">ZEV DOD SYSTEMS</div>
    <h1>APEX</h1>
    <p class="subtitle">
      AI Tactical Vision<br>
      HeyCyan W630 Smart Glasses Companion
    </p>
    <div class="status">
      SYSTEM INTERFACE ONLINE
    </div>
    
<button id="testVoice" onclick="testAPEXVoice()">
  TEST W630 AUDIO
</button>

<p id="voiceStatus" class="subtitle">
  Bluetooth voice test ready.
</p>

<script>
function testAPEXVoice() {
  const status = document.getElementById(
    "voiceStatus"
  );

  if (!("speechSynthesis" in window)) {
    status.textContent =
      "Speech is not supported in this browser.";
    return;
  }

  window.speechSynthesis.cancel();

  const message = new SpeechSynthesisUtterance(
    "ZEV DOD APEX online. " +
    "Tactical voice communication systems ready."
  );

  message.lang = "en-US";
  message.rate = 0.9;
  message.volume = 1;

  message.onstart = () => {
    status.textContent = "Voice test playing.";
  };

  message.onend = () => {
    status.textContent = "Voice test complete.";
  };

  message.onerror = () => {
    status.textContent = "Voice playback failed.";
  };

  window.speechSynthesis.speak(message);
}
</script>

    <p class="subtitle">
      Initial installation successful.
    </p>
  </div>
</body>
</html>
